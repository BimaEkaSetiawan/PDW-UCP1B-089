<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Gallery</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Multimedia Gallery</h1>
        <nav>
            <a href="./index.html">Beranda</a>
            <a href="./form.html">Form Anggota</a>
            <a href="./gallery.html">Multimedia</a>
        </nav>
    </header>
    <main>
        <h2>Gambar</h2>
        <div class="gallery-section">
            <img id="gallery-image" src="robot.jpg" alt="Gambar Tech" width="300"><br>
            <button onclick="changeImage()">Ubah Gambar</button>
        </div>
    
        <h2>Video</h2>
        <div class="gallery-section">
            <iframe src="https://www.youtube.com/embed/XKLHVDr8JXg?si=CU4uFWZS_tjMyzKx" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    
        <h2>Audio</h2>
        <div class="gallery-section">
            <audio id="audio-player" controls>
                <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.wav" type="audio/wav">
                Browser Anda tidak mendukung tag audio.
            </audio><br>
            <button onclick="playAudio()">Putar Audio</button>
            <button onclick="pauseAudio()">Hentikan Audio</button>
            <button onclick="showInfo()">Info Audio</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Tech Community. All rights reserved.</p>
    </footer>
    
    <script src="./script.js"></script>
</body>
</html>
